<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#243042" />
      <stop offset="100%" stop-color="#0a0e14" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be" />
      <stop offset="50%" stop-color="#d3a625" />
      <stop offset="100%" stop-color="#946b2d" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#740001" />
      <stop offset="100%" stop-color="#3d0001" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8" />

  <!-- Hogwarts Shield Crest -->
  <path d="M256 64 C350 64, 400 110, 400 230 C400 350, 310 420, 256 448 C202 420, 112 350, 112 230 C112 110, 162 64, 256 64 Z" 
        fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Magical Golden Lightning Bolt -->
  <polygon points="275,100 190,260 260,260 235,410 335,230 265,230" 
           fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Stars / Sparkles -->
  <circle cx="160" cy="170" r="8" fill="#fce498" filter="url(#glow)" />
  <circle cx="350" cy="170" r="8" fill="#fce498" filter="url(#glow)" />
  <circle cx="256" cy="76" r="6" fill="#fce498" />
</svg>
